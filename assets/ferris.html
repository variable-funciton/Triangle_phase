<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
/*__CSS__*/
.layout { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 12px; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
#wheel, #graph { height: 430px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <h3>観覧車の大きさ</h3>
    <div class="params three" id="params"></div>
    <div class="btns" style="margin-top:8px">
      <button class="btn play" id="play"></button>
      <div class="seg" data-key="speed"><button data-v="1">ふつう</button><button data-v="3">速い</button><button data-v="8">とても速い</button></div>
      <span class="hint">プリセット：</span>
      <button class="btn" data-preset="0">小さな観覧車</button><button class="btn" data-preset="1">大型の観覧車</button><button class="btn" data-preset="2">世界最大級</button>
    </div>
  </div>

  <div class="formula"><div class="main" id="formula"></div><div class="sub" id="formula2"></div></div>
  <div class="layout">
    <div class="plot" id="wheel"></div>
    <div class="plot" id="graph"></div>
  </div>
  <div class="box">
    <h3>高さ H m 以上にいる時間は？</h3>
    <div class="params" id="params2"></div>
    <div class="metrics" id="metrics"></div>
    <div class="info-box" id="above"></div>
  </div>
</div>

<script>
/*__COMMON__*/
</script>
<script>
/*__CORE__*/
</script>
<script>
(function () {
  "use strict";
  if (!UI.ready()) return;
  var $ = UI.$, tex = UI.tex;
  var C = { wheel: "#9aa0a6", g: "#d62728", h: "#1f77b4", band: "rgba(255,127,14,0.14)", H: "#ff7f0e" };
  var S = UI.store("ferris_v1", { r: 50, T: 16, base: 5, t: 0, H: 80, speed: "1" });
  var PRESETS = [{ r: 10, T: 6, base: 2 }, { r: 50, T: 16, base: 5 }, { r: 120, T: 38, base: 10 }];
  function p() { return { r: S.r, T: S.T, h0: S.r + S.base }; }
  function f1(v) { return TU.fmtNum(v, 1); }

  var P1 = UI.params("params", [
    { key: "r", label: "r", sub: "半径 [m]", min: 5, max: 130, step: 1, fmt: function (v) { return v + " m"; } },
    { key: "T", label: "T", sub: "1 周の時間 [分]", min: 3, max: 40, step: 0.5, fmt: function (v) { return f1(v) + " 分"; } },
    { key: "base", label: "a", sub: "いちばん下のゴンドラの高さ [m]", min: 0, max: 15, step: 0.5, fmt: function (v) { return f1(v) + " m"; } },
  ], S, function () { clampT(); redraw(); });
  var P2 = UI.params("params2", [
    { key: "t", label: "t", sub: "乗ってからの時間 [分]", min: 0, max: 40, step: 0.05, fmt: function (v) { return TU.fmtNum(v, 2) + " 分"; } },
    { key: "H", label: "H", sub: "調べる高さ [m]", min: 0, max: 280, step: 1, fmt: function (v) { return v + " m"; } },
  ], S, function () { redraw(); });
  function clampT() { $("p-t").max = S.T; if (S.t > S.T) S.t = S.t % S.T; $("p-t").value = S.t; $("p-H").max = Math.ceil(2 * S.r + S.base + 5); }

  function draw() {
    var q = p(), h = FW.height(q, S.t), pos = FW.position(q, S.t), ab = FW.above(q, S.H);
    var w = TU.fmtNum(2 * Math.PI / q.T, 3);
    $("formula").innerHTML = tex("h = " + q.h0 + " - " + q.r + "\\cos\\frac{2\\pi t}{" + f1(q.T) + "}", true);
    $("formula2").innerHTML = tex("= " + q.r + "\\sin\\frac{2\\pi}{" + f1(q.T) + "}\\left(t - " + TU.fmtNum(q.T / 4, 2) + "\\right) + " + q.h0
      + "\\qquad (t = " + TU.fmtNum(S.t, 2) + "\\ \\text{分のとき}\\ h \\approx " + f1(h) + "\\ \\text{m})");

    // ---- 観覧車の図 ----
    var R = q.r * 1.15, top = q.h0 + R;
    var ring = UI.circle(0, q.h0, q.r, 160), data = [];
    data.push(UI.lineTrace(ring.x, ring.y, "観覧車", C.wheel, { width: 3, extra: { hoverinfo: "skip" } }));
    for (var k = 0; k < 12; k++) {    // スポーク
      var a = 2 * Math.PI * k / 12 + 2 * Math.PI * S.t / q.T;
      data.push(UI.lineTrace([0, q.r * Math.sin(a)], [q.h0, q.h0 - q.r * Math.cos(a)], "", "rgba(0,0,0,0.12)", { width: 1, extra: { hoverinfo: "skip" } }));
    }
    data.push(UI.lineTrace([-q.r * 0.5, 0, q.r * 0.5], [0, q.h0, 0], "支柱", "#666", { width: 3, extra: { hoverinfo: "skip" } }));
    data.push(UI.lineTrace([0, pos[0]], [q.h0, pos[1]], "", C.g, { width: 2, extra: { hoverinfo: "skip" } }));
    data.push(UI.pointTrace([pos[0]], [pos[1]], "ゴンドラ", C.g, 15));
    var L1 = UI.layout({ height: $("wheel").clientHeight || 430, showlegend: false, margin: { l: 44, r: 10, t: 10, b: 36 },
      xaxis: UI.axis({ range: [-R, R], zeroline: false, title: { text: "横 [m]" } }),
      yaxis: UI.axis({ range: [-R * 0.05, top], scaleanchor: "x", title: { text: "高さ [m]" } }) });
    L1.shapes.push({ type: "line", x0: -R, x1: R, y0: S.H, y1: S.H, line: { color: C.H, width: 1.5, dash: "dot" } });
    L1.shapes.push({ type: "line", x0: pos[0], x1: pos[0], y0: 0, y1: pos[1], line: { color: C.h, width: 1.5, dash: "dash" } });
    L1.shapes.push({ type: "line", x0: 0, x1: pos[0], y0: q.h0, y1: q.h0, line: { color: "rgba(0,0,0,0.3)", width: 1, dash: "dot" } });
    L1.annotations.push({ x: pos[0], y: pos[1] / 2, text: "h ≈ " + f1(h) + " m", showarrow: false, xanchor: pos[0] >= 0 ? "left" : "right", xshift: pos[0] >= 0 ? 6 : -6, font: { color: C.h, size: 13 } });
    L1.annotations.push({ x: R, y: S.H, text: "H = " + S.H + " m", showarrow: false, xanchor: "right", yanchor: "bottom", font: { color: C.H, size: 12 } });
    Plotly.react("wheel", data, L1, UI.CONFIG);

    // ---- 高さのグラフ ----
    var ts = TU.linspace(0, q.T * 2, 500);
    var L2 = UI.layout({ height: $("graph").clientHeight || 430, showlegend: false, margin: { l: 50, r: 14, t: 10, b: 40 },
      xaxis: UI.axis({ range: [0, q.T * 2], title: { text: "時間 t [分]" } }),
      yaxis: UI.axis({ range: [-R * 0.05, top], title: { text: "高さ h [m]" } }) });
    if (!ab.none) [0, q.T].forEach(function (off) {
      L2.shapes.push({ type: "rect", x0: off + ab.t1, x1: off + ab.t2, yref: "paper", y0: 0, y1: 1, fillcolor: C.band, line: { width: 0 }, layer: "below" });
    });
    L2.shapes.push({ type: "line", x0: 0, x1: q.T * 2, y0: S.H, y1: S.H, line: { color: C.H, width: 1.5, dash: "dot" } });
    L2.shapes.push({ type: "line", x0: 0, x1: q.T * 2, y0: q.h0, y1: q.h0, line: { color: "rgba(0,0,0,0.3)", width: 1, dash: "dash" } });
    L2.annotations.push({ x: q.T * 2, y: q.h0, text: "中心の高さ " + q.h0 + " m", showarrow: false, xanchor: "right", yanchor: "bottom", font: { size: 11, color: "#666" } });
    var d2 = [UI.lineTrace(ts, ts.map(function (t) { return FW.height(q, t); }), "h(t)", C.h, { width: 2.8, extra: { hovertemplate: "t = %{x:.2f} 分<br>h = %{y:.1f} m<extra></extra>" } }),
      UI.pointTrace([S.t], [h], "いま", C.g, 13)];
    Plotly.react("graph", d2, L2, UI.CONFIG);

    UI.metrics("metrics", [
      ["いちばん高い所", f1(q.h0 + q.r) + " m"], ["周期", f1(q.T) + " 分"], ["振幅", q.r + " m"],
      ["H 以上にいる時間", ab.none ? "0 分" : f1(ab.duration) + " 分"], ["1 周に対する割合", TU.fmtNum(100 * ab.duration / q.T, 1) + " %"],
    ]);
    $("above").innerHTML = ab.none ? "H がいちばん高い所より高いので、届きません。"
      : ab.all ? "ずっと H より高い所にいます。"
      : tex("h \\ge H") + " ⇔ " + tex(q.h0 + " - " + q.r + "\\cos\\theta \\ge " + S.H) + " ⇔ " + tex("\\cos\\theta \\le " + TU.fmtNum((q.h0 - S.H) / q.r, 3))
        + "（" + tex("\\theta = \\frac{2\\pi t}{T}") + "）<br>"
        + tex("\\cos\\theta = " + TU.fmtNum((q.h0 - S.H) / q.r, 3)) + " となる θ は " + tex("\\theta \\approx " + TU.fmtNum(Math.acos((q.h0 - S.H) / q.r) * 180 / Math.PI, 1) + "^\\circ")
        + " と " + tex(TU.fmtNum(360 - Math.acos((q.h0 - S.H) / q.r) * 180 / Math.PI, 1) + "^\\circ") + "。"
        + "その間（t ≈ " + TU.fmtNum(ab.t1, 2) + " 〜 " + TU.fmtNum(ab.t2, 2) + " 分、オレンジの帯）が H 以上にいる時間です。";
    S.save();
  }
  var redraw = UI.throttle(draw);
  var player = new UI.Player($("play"), function (dt) {
    S.t = (S.t + dt * Number(S.speed) / 6) % S.T; $("p-t").value = S.t; P2.show(); draw();
  }, ["▶ 観覧車を回す", "⏸ 停止"]);
  document.querySelectorAll("[data-preset]").forEach(function (b) {
    b.addEventListener("click", function () { Object.assign(S, PRESETS[Number(b.dataset.preset)]); S.t = 0; S.H = Math.round(S.r * 1.6); P1.sync(); clampT(); P2.sync(); redraw(); });
  });
  UI.bindSegs(S, function () { UI.syncSegs(S); });
  UI.syncSegs(S); P1.sync(); clampT(); P2.sync(); draw();
})();
</script>
</body>
</html>
