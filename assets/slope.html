<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
/*__CSS__*/
.layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 12px; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
#tri, #conv { height: 400px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <h3>勾配を決める</h3>
    <div class="btns" id="examples" style="margin-bottom:8px"></div>
    <div class="params" id="params"></div>
  </div>
  <div class="formula"><div class="main" id="formula"></div></div>
  <div class="metrics" id="metrics"></div>
  <div class="layout">
    <div class="plot" id="tri"></div>
    <div class="plot" id="conv"></div>
  </div>
  <div class="info-box" id="msg"></div>
</div>

<script>
/*__COMMON__*/
</script>
<script>
/*__CORE__*/
</script>
<script>
(function () {
  "use strict";
  if (!UI.ready()) return;
  var $ = UI.$, tex = UI.tex;
  var S = UI.store("slope_v1", { th: 5.71, s: 100 });
  function f(v, d) { return TU.fmtNum(v, d === undefined ? 2 : d); }
  var P = UI.params("params", [
    { key: "th", label: "θ", sub: "勾配の角度 [°]", min: 0, max: 60, step: 0.01, btn: 0.5, fmt: function (v) { return f(v) + "°"; } },
    { key: "s", label: "s", sub: "坂に沿って進む長さ [m]", min: 10, max: 500, step: 1, btn: 10, fmt: function (v) { return v + " m"; } },
  ], S, function () { redraw(); });
  $("examples").innerHTML = '<span class="hint">身近な例：</span>' + SL.EXAMPLES.map(function (e, i) { return '<button class="btn" data-i="' + i + '">' + e.name + "</button>"; }).join("");
  $("examples").querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () { S.th = Math.atan(SL.EXAMPLES[Number(b.dataset.i)].tan) * 180 / Math.PI; P.sync(); redraw(); });
  });

  function draw() {
    var g = SL.fromAngle(S.th), th = S.th * Math.PI / 180, hz = S.s * Math.cos(th), up = S.s * Math.sin(th);
    $("formula").innerHTML = tex("\\tan\\theta = \\frac{\\text{高さ}}{\\text{水平距離}} = " + f(g.tan, 4) + " = " + f(g.percent) + "\\,\\% = " + f(g.permil, 1) + "\\,‰", true);
    UI.metrics("metrics", [["角度", f(S.th) + "°"], ["パーセント（100 tan θ）", f(g.percent) + " %"], ["パーミル（1000 tan θ）", f(g.permil, 1) + " ‰"],
      ["寸勾配（10 tan θ）", f(g.sun) + " 寸"], ["比（高さ 1 : 水平 n）", g.tan > 1e-9 ? "1 : " + f(g.ratioN, 1) : "—"],
      ["s m 進んだときの水平距離 s cos θ", f(hz, 1) + " m"], ["上がる高さ s sin θ", f(up, 1) + " m"]]);

    // ---- 三角形（縦は見やすく 1 倍のまま） ----
    var W = Math.max(hz, 10), data = [];
    var L = UI.layout({ height: $("tri").clientHeight || 400, showlegend: false, margin: { l: 44, r: 14, t: 10, b: 40 },
      xaxis: UI.axis({ range: [-W * 0.05, W * 1.3], zeroline: false, title: { text: "水平距離 [m]" } }),
      yaxis: UI.axis({ range: [-W * 0.05, Math.max(up, W * 0.3) * 1.2], zeroline: false, scaleanchor: "x", title: { text: "高さ [m]" } }) });
    data.push(UI.lineTrace([0, hz, hz, 0], [0, 0, up, 0], "", "#333", { width: 2, extra: { fill: "toself", fillcolor: "rgba(255,127,14,0.15)", hoverinfo: "skip" } }));
    data.push(UI.lineTrace([0, hz], [0, up], "坂", "#d62728", { width: 4, extra: { hoverinfo: "skip" } }));
    L.annotations.push({ x: hz / 2, y: 0, text: "s cos θ ≈ " + f(hz, 1) + " m", showarrow: false, yanchor: "top", yshift: -4 });
    L.annotations.push({ x: hz, y: up / 2, text: "s sin θ ≈ " + f(up, 1) + " m", showarrow: false, xanchor: "left", xshift: 4 });
    L.annotations.push({ x: hz / 2, y: up / 2, text: "s = " + S.s + " m", showarrow: false, xanchor: "right", yanchor: "bottom", xshift: -6, font: { color: "#d62728" } });
    L.annotations.push({ x: W * 0.12, y: W * 0.12 * Math.tan(th) / 2, text: "θ", showarrow: false, font: { size: 14 } });
    Plotly.react("tri", data, L, UI.CONFIG);

    // ---- 角度とパーセントの関係（比例しない） ----
    var ds = TU.linspace(0, 60, 301);
    var d2 = [UI.lineTrace(ds, ds.map(function (d) { return 100 * Math.tan(d * Math.PI / 180); }), "勾配 [%] = 100 tan θ", "#1f77b4", { width: 2.8 }),
      UI.lineTrace([0, 60], [0, 60 * 100 / 45], "もし比例していたら（45° で 100%）", "#9aa0a6", { width: 1.5, dash: "dash" }),
      UI.pointTrace([S.th], [g.percent], "いま", "#d62728", 11)];
    var L2 = UI.layout({ height: $("conv").clientHeight || 400, xaxis: UI.axis({ range: [0, 60], dtick: 10, title: { text: "角度 θ [°]" } }),
      yaxis: UI.axis({ range: [0, 180], dtick: 20, title: { text: "勾配 [%]" } }) });
    Plotly.react("conv", d2, L2, UI.CONFIG);
    $("msg").innerHTML = "坂の急さは、角度ではなく <b>tan θ（高さ ÷ 水平距離）</b> で表すことがよくあります。道路は % （100 m 進むと何 m 上がるか）、鉄道は ‰（1000 m で何 m）、建築の屋根は寸勾配（水平 10 寸で何寸）、バリアフリーのスロープは比（1/12 など）。"
      + "<br>「100% の坂」は垂直ではなく 45°。% と角度は比例しません（右のグラフ）。小さい角度ではほぼ比例し、" + tex("\\tan\\theta \\approx \\theta\\ [\\text{rad}]") + "。"
      + "<br>地図の上の距離は水平距離なので、坂に沿った実際の長さ s とは " + tex("\\text{水平距離} = s\\cos\\theta") + " の関係があります。";
    S.save();
  }
  var redraw = UI.throttle(draw);
  P.sync(); draw();
})();
</script>
</body>
</html>
