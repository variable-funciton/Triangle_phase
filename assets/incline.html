<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
/*__CSS__*/
.layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
#fig, #graph { height: 430px; }
.state { font-size: 20px; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <h3>斜面と物体</h3>
    <div class="params three" id="params"></div>
    <div class="btns" style="margin-top:8px">
      <button class="btn play" id="play"></button>
      <button class="btn" id="back">物体を上にもどす</button>
      <div class="checks" id="checks" style="margin-left:10px"></div>
    </div>
  </div>
  <div class="formula"><div class="main" id="formula"></div><div class="sub" id="formula2"></div></div>
  <div class="layout">
    <div class="plot" id="fig"></div>
    <div class="plot" id="graph"></div>
  </div>
  <div class="metrics" id="metrics"></div>
  <div class="info-box" id="msg"></div>
</div>

<script>
/*__COMMON__*/
</script>
<script>
/*__CORE__*/
</script>
<script>
(function () {
  "use strict";
  if (!UI.ready()) return;
  var $ = UI.$, tex = UI.tex;
  var C = { W: "#333", along: "#d62728", normal: "#1f77b4", N: "#2ca02c", f: "#ff7f0e" };
  var S = UI.store("incline_v1", { th: 25, mu: 0.4, m: 2, show: { comp: true, other: true } });
  var P = UI.params("params", [
    { key: "th", label: "θ", sub: "斜面の角度 [°]", min: 0, max: 60, step: 0.5, btn: 1, fmt: function (v) { return TU.fmtNum(v, 1) + "°"; } },
    { key: "mu", label: "μ", sub: "摩擦係数", min: 0, max: 1.2, step: 0.01, btn: 0.05, fmt: function (v) { return TU.fmtNum(v, 2); } },
    { key: "m", label: "m", sub: "質量 [kg]", min: 0.5, max: 10, step: 0.5, fmt: function (v) { return TU.fmtNum(v, 1) + " kg"; } },
  ], S, function () { s = 0; redraw(); });
  UI.checks("checks", [{ key: "comp", label: "重力の分解を表示" }, { key: "other", label: "垂直抗力・摩擦力も表示" }], S, function () { redraw(); });
  var s = 0, Lslope = 10;   // 物体が斜面をすべった距離 [m]、斜面の長さ

  function draw() {
    var F = IC.forces(S.m, S.th, S.mu), th = S.th * Math.PI / 180, fa = IC.frictionAngle(S.mu);
    $("formula").innerHTML = tex("mg\\sin\\theta = " + TU.fmtNum(F.along, 2) + "\\ \\text{N},\\qquad mg\\cos\\theta = " + TU.fmtNum(F.normal, 2) + "\\ \\text{N}", true);
    $("formula2").innerHTML = tex("\\text{最大摩擦力}\\ \\mu mg\\cos\\theta = " + TU.fmtNum(F.fmax, 2) + "\\ \\text{N}\\quad\\Rightarrow\\quad " + (F.slides ? "\\text{すべる}" : "\\text{すべらない}"));

    // ---- 図：斜面（左下が低い、右上が高い。物体は右上から左下へすべる） ----
    var c = Math.cos(th), sn = Math.sin(th), data = [];
    var base = Lslope * c, height = Lslope * sn;
    var L = UI.layout({ height: $("fig").clientHeight || 430, showlegend: false, margin: { l: 10, r: 10, t: 10, b: 10 },
      xaxis: UI.axis({ range: [-1.5, 11.5], visible: false }), yaxis: UI.axis({ range: [-1.5, 9.5], visible: false, scaleanchor: "x" }) });
    L.shapes.push({ type: "path", path: "M 0 0 L " + base + " 0 L " + base + " " + height + " Z", fillcolor: "rgba(0,0,0,0.06)", line: { color: "#555", width: 2 } });
    // 物体の位置（斜面に沿って上端から s だけ下）
    var d = Math.max(0.8, Math.min(Lslope - 0.8, Lslope * 0.75 - s));
    var bx = d * c, by = d * sn, h = 0.8, w = 1.2;
    var ux = [c, sn], nx = [-sn, c];     // 斜面に沿った上向き・斜面に垂直な外向き
    var corners = [[-w / 2, 0], [w / 2, 0], [w / 2, h], [-w / 2, h]].map(function (q) { return [bx + q[0] * ux[0] + q[1] * nx[0], by + q[0] * ux[1] + q[1] * nx[1]]; });
    L.shapes.push({ type: "path", path: "M " + corners.map(function (q) { return q[0] + " " + q[1]; }).join(" L ") + " Z", fillcolor: "rgba(148,103,189,0.4)", line: { color: "#9467bd", width: 2 } });
    var G0 = [bx + (h / 2) * nx[0], by + (h / 2) * nx[1]], k = 2.6 / F.W;   // 力の矢印の長さ（mg を 2.6 にする）
    UI.arrow(L, G0, [G0[0], G0[1] - F.W * k], C.W, "mg");
    if (S.show.comp) {
      var A1 = [G0[0] - F.along * k * ux[0], G0[1] - F.along * k * ux[1]];
      var A2 = [G0[0] - F.normal * k * nx[0], G0[1] - F.normal * k * nx[1]];
      UI.arrow(L, G0, A1, C.along, "mg sin θ");
      UI.arrow(L, G0, A2, C.normal, "mg cos θ");
      var Tp = [A1[0] + A2[0] - G0[0], A1[1] + A2[1] - G0[1]];   // mg の先端 = 2 成分の和
      data.push(UI.lineTrace([A1[0], Tp[0], A2[0]], [A1[1], Tp[1], A2[1]], "", "rgba(0,0,0,0.3)", { width: 1, dash: "dot", extra: { hoverinfo: "skip" } }));
    }
    if (S.show.other) {
      UI.arrow(L, G0, [G0[0] + F.normal * k * nx[0], G0[1] + F.normal * k * nx[1]], C.N, "N");
      if (F.friction > 1e-9) UI.arrow(L, G0, [G0[0] + F.friction * k * ux[0], G0[1] + F.friction * k * ux[1]], C.f, "摩擦力");
    }
    L.annotations.push({ x: 1.6 * Math.cos(th / 2), y: 1.6 * Math.sin(th / 2) - 0.1, text: "θ", showarrow: false, font: { size: 15 } });
    data.push(UI.pointTrace([G0[0]], [G0[1]], "", "#333", 6, { hoverinfo: "skip" }));
    Plotly.react("fig", data, L, UI.CONFIG);

    // ---- グラフ：斜面方向の力と最大摩擦力（mg を 1 とした割合） ----
    var ths = TU.linspace(0, 90, 181);
    var g = [UI.lineTrace(ths, ths.map(function (t) { return Math.sin(t * Math.PI / 180); }), "sin θ（すべらせる力 ÷ mg）", C.along, { width: 2.8 }),
      UI.lineTrace(ths, ths.map(function (t) { return S.mu * Math.cos(t * Math.PI / 180); }), "μ cos θ（最大摩擦力 ÷ mg）", C.f, { width: 2.8 }),
      UI.pointTrace([S.th, S.th], [Math.sin(th), S.mu * Math.cos(th)], "いまの角度", "#333", 9)];
    var L2 = UI.layout({ height: $("graph").clientHeight || 430,
      xaxis: UI.axis({ range: [0, 90], dtick: 15, title: { text: "斜面の角度 θ [°]" } }), yaxis: UI.axis({ range: [0, Math.max(1.05, S.mu + 0.05)], title: { text: "mg に対する割合" } }) });
    L2.shapes.push({ type: "rect", x0: fa, x1: 90, yref: "paper", y0: 0, y1: 1, fillcolor: "rgba(214,39,40,0.07)", line: { width: 0 }, layer: "below" });
    L2.shapes.push({ type: "line", x0: fa, x1: fa, yref: "paper", y0: 0, y1: 1, line: { color: "#555", width: 1.2, dash: "dash" } });
    L2.shapes.push({ type: "line", x0: S.th, x1: S.th, yref: "paper", y0: 0, y1: 1, line: { color: "#333", width: 1, dash: "dot" } });
    L2.annotations.push({ x: fa, y: 1, yref: "paper", text: "摩擦角 " + TU.fmtNum(fa, 1) + "°", showarrow: false, xanchor: "left", yanchor: "top", font: { size: 12 } });
    L2.annotations.push({ x: (fa + 90) / 2, y: 0.05, yref: "paper", text: "すべる", showarrow: false, font: { size: 13, color: C.along } });
    Plotly.react("graph", g, L2, UI.CONFIG);

    UI.metrics("metrics", [["重力 mg", TU.fmtNum(F.W, 1) + " N"], ["摩擦角（tan θ = μ）", TU.fmtNum(fa, 1) + "°"], ["tan θ", TU.fmtNum(Math.tan(th), 3)],
      ["状態", '<span class="state" style="color:' + (F.slides ? C.along : C.N) + '">' + (F.slides ? "すべる" : "止まっている") + "</span>"],
      ["すべるときの加速度", F.slides ? TU.fmtNum(F.accel, 2) + " m/s²" : "—"]]);
    $("msg").innerHTML = "斜面の角度を大きくすると、すべらせようとする力 " + tex("mg\\sin\\theta") + " は大きく、斜面を押す力 " + tex("mg\\cos\\theta") + "（と摩擦力の上限）は小さくなります。"
      + "<br>2 つが等しくなる角度 " + tex("mg\\sin\\theta = \\mu mg\\cos\\theta") + " ⇔ " + tex("\\tan\\theta = \\mu") + " が <b>摩擦角</b>。これより急になるとすべり出します。"
      + "質量 m を変えても摩擦角は変わりません（両辺の mg が消える）。"
      + "<br>摩擦係数をはかる実験：板の上に物体をのせ、板をゆっくり傾けていき、すべり出した角度 θ から " + tex("\\mu = \\tan\\theta") + " と求めます。";
    S.save();
  }
  var redraw = UI.throttle(draw);
  var vel = 0;
  $("play").addEventListener("click", function () { if (Lslope * 0.75 - s < 0.8) { s = 0; vel = 0; } });   // 下に着いていたら上から
  new UI.Player($("play"), function (dt) {
    var F = IC.forces(S.m, S.th, S.mu);
    if (!F.slides) return false;
    vel += F.accel * dt; s += vel * dt;
    if (Lslope * 0.75 - s < 0.8) { draw(); return false; }
    draw();
  }, ["▶ 手を放す", "⏸ 停止"]);
  $("back").addEventListener("click", function () { s = 0; vel = 0; redraw(); });
  P.sync(); draw();
})();
</script>
</body>
</html>
