<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
/*__CSS__*/
#side { height: 400px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
#top, #len { height: 420px; }
.ok { color: #2ca02c; font-weight: 700; } .ng { color: #d62728; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <h3>場所と日付</h3>
    <div class="settings" style="margin-bottom:8px">
      <div class="btns" id="dates"></div>
      <div class="btns" id="lats"></div>
    </div>
    <div class="params" id="params"></div>
  </div>
  <div class="tabs">
    <button data-tab="spacing">① 南中時の影と建物の間隔</button>
    <button data-tab="day">② 1 日の影の動き（日影曲線）</button>
  </div>
  <div id="tab-spacing">
    <div class="params" id="params-s"></div>
    <div class="formula"><div class="main" id="formula-s"></div><div class="sub" id="formula-s2"></div></div>
    <div class="plot" id="side"></div>
    <div class="metrics" id="metrics-s"></div>
    <div class="info-box" id="msg-s"></div>
  </div>
  <div id="tab-day" hidden>
    <div class="params" id="params-d"></div>
    <div class="btns"><button class="btn play" id="play"></button></div>
    <div class="formula"><div class="sub" id="formula-d"></div></div>
    <div class="layout"><div class="plot" id="top"></div><div class="plot" id="len"></div></div>
    <div class="metrics" id="metrics-d"></div>
    <div class="info-box" id="msg-d"></div>
  </div>
</div>

<script>
/*__COMMON__*/
</script>
<script>
/*__CORE__*/
</script>
<script>
(function () {
  "use strict";
  if (!UI.ready()) return;
  var $ = UI.$, tex = UI.tex;
  var S = UI.store("shadow_v1", { tab: "spacing", lat: 35.7, N: 355, Hb: 20, Dist: 30, hour: 10, pole: 1 });
  var DATES = [["冬至（12/22 ごろ）", 355], ["春分（3/21 ごろ）", 80], ["夏至（6/21 ごろ）", 172], ["秋分（9/23 ごろ）", 266]];
  var LATS = [["那覇 26.2°", 26.2], ["東京 35.7°", 35.7], ["札幌 43.1°", 43.1]];
  var MS = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  function dateText(N) { var m = 11; while (m > 0 && N <= MS[m]) m--; return (m + 1) + "/" + (N - MS[m]); }
  function f(v, d) { return TU.fmtNum(v, d === undefined ? 1 : d); }

  var P = UI.params("params", [
    { key: "lat", label: "φ", sub: "緯度（北緯）[°]", min: 0, max: 60, step: 0.1, btn: 1, fmt: function (v) { return f(v) + "°"; } },
    { key: "N", label: "日付", sub: "1 月 1 日からの日数", min: 1, max: 365, step: 1, fmt: dateText },
  ], S, function () { redraw(); });
  var PS = UI.params("params-s", [
    { key: "Hb", label: "H", sub: "南側の建物の高さ [m]", min: 3, max: 60, step: 0.5, btn: 1, fmt: function (v) { return f(v) + " m"; } },
    { key: "Dist", label: "D", sub: "北側の建物までの距離 [m]", min: 2, max: 150, step: 0.5, btn: 1, fmt: function (v) { return f(v) + " m"; } },
  ], S, function () { redraw(); });
  var PD = UI.params("params-d", [
    { key: "hour", label: "時刻", sub: "（太陽が真南にくる時刻を 12 時とする）", min: 4, max: 20, step: 0.05, btn: 0.5, fmt: function (v) { var m = Math.round(v * 60); return Math.floor(m / 60) + ":" + ("0" + m % 60).slice(-2); } },
    { key: "pole", label: "h", sub: "棒の高さ [m]", min: 0.5, max: 3, step: 0.1, fmt: function (v) { return f(v) + " m"; } },
  ], S, function () { redraw(); });
  $("dates").innerHTML = DATES.map(function (q, i) { return '<button class="btn" data-i="' + i + '">' + q[0] + "</button>"; }).join("");
  $("dates").querySelectorAll("button").forEach(function (b) { b.addEventListener("click", function () { S.N = DATES[Number(b.dataset.i)][1]; P.sync(); redraw(); }); });
  $("lats").innerHTML = LATS.map(function (q, i) { return '<button class="btn" data-i="' + i + '">' + q[0] + "</button>"; }).join("");
  $("lats").querySelectorAll("button").forEach(function (b) { b.addEventListener("click", function () { S.lat = LATS[Number(b.dataset.i)][1]; P.sync(); redraw(); }); });

  function drawSpacing() {
    var dec = SH.declination(S.N), h = SH.noonAltitude(S.lat, dec), L = SH.shadowLength(S.Hb, h), Dmin = L, ok = S.Dist >= Dmin;
    $("formula-s").innerHTML = tex("h = 90^\\circ - \\varphi + \\delta = 90^\\circ - " + f(S.lat) + "^\\circ " + (dec < 0 ? "- " : "+ ") + f(Math.abs(dec)) + "^\\circ = " + f(h) + "^\\circ", true);
    $("formula-s2").innerHTML = tex("\\text{影の長さ}\\ L = \\frac{H}{\\tan h} = \\frac{" + f(S.Hb) + "}{\\tan " + f(h) + "^\\circ} \\approx " + f(L) + "\\ \\text{m}");
    var W = Math.max(S.Dist + 15, Math.min(L, 200) + 10), Y = Math.max(S.Hb * 1.6, 10), data = [];
    var Lp = UI.layout({ height: $("side").clientHeight || 400, showlegend: false, margin: { l: 44, r: 10, t: 10, b: 40 },
      xaxis: UI.axis({ range: [-12, W], zeroline: false, title: { text: "南 ← → 北　[m]" } }), yaxis: UI.axis({ range: [-1, Y], title: { text: "高さ [m]" }, scaleanchor: "x" }) });
    Lp.shapes.push({ type: "rect", x0: -8, x1: 0, y0: 0, y1: S.Hb, fillcolor: "rgba(31,119,180,0.35)", line: { color: "#1f77b4" } });
    Lp.shapes.push({ type: "rect", x0: S.Dist, x1: S.Dist + 8, y0: 0, y1: S.Hb * 0.8, fillcolor: ok ? "rgba(44,160,44,0.3)" : "rgba(120,120,120,0.35)", line: { color: ok ? "#2ca02c" : "#666" } });
    Lp.shapes.push({ type: "line", x0: -12, x1: W, y0: 0, y1: 0, line: { color: "#555", width: 2 } });
    // 影（地面の上の黒い帯）と光線
    data.push(UI.lineTrace([0, Math.min(L, W)], [0.15, 0.15], "影", "#333", { width: 8, extra: { hoverinfo: "skip" } }));
    var t = Math.tan(h * Math.PI / 180), x0 = -Math.min(12, S.Hb * 3 / Math.max(t, 0.05));
    data.push(UI.lineTrace([0 - (Y - S.Hb) / t, Math.min(L, W)], [Y, Math.max(0, S.Hb - Math.min(L, W) * t)], "太陽の光", "#ff7f0e", { width: 2, dash: "dash", extra: { hoverinfo: "skip" } }));
    var arc = []; for (var i = 0; i <= 30; i++) { var a = Math.PI - h * Math.PI / 180 * i / 30; arc.push(a); }
    var ar = Math.min(6, L * 0.4);
    data.push(UI.lineTrace(arc.map(function (a) { return L + ar * Math.cos(a); }), arc.map(function (a) { return ar * Math.sin(a); }), "h", "#d62728", { width: 2, extra: { hoverinfo: "skip" } }));
    Lp.annotations.push({ x: L - ar * 1.2, y: ar * 0.5, text: "h = " + f(h) + "°", showarrow: false, xanchor: "right", font: { color: "#d62728", size: 13 } });
    Lp.annotations.push({ x: -4, y: S.Hb, text: "H = " + f(S.Hb) + " m", showarrow: false, yanchor: "bottom", font: { size: 12 } });
    Lp.annotations.push({ x: S.Dist + 4, y: S.Hb * 0.8, text: ok ? "日が当たる" : "日かげ", showarrow: false, yanchor: "bottom", font: { size: 13, color: ok ? "#2ca02c" : "#666" } });
    Lp.annotations.push({ x: Math.min(L, W) / 2, y: 0.4, text: "影 L ≈ " + f(L) + " m", showarrow: false, yanchor: "bottom", font: { size: 12 } });
    Plotly.react("side", data, Lp, UI.CONFIG);
    UI.metrics("metrics-s", [["太陽の赤緯 δ", f(dec) + "°"], ["南中高度 h", f(h) + "°"], ["tan h", TU.fmtNum(Math.tan(h * Math.PI / 180), 3)],
      ["影の長さ ÷ 高さ", TU.fmtNum(1 / Math.tan(h * Math.PI / 180), 2) + " 倍"], ["必要な間隔", f(Dmin) + " m"],
      ["判定", ok ? '<span class="ok">南中時に日が当たる</span>' : '<span class="ng">南中時も日かげ</span>']]);
    $("msg-s").innerHTML = "太陽が真南にきたとき（南中）の高さは " + tex("h = 90^\\circ - \\varphi + \\delta") + "。冬至（" + tex("\\delta \\approx -23.4^\\circ") + "）には東京で約 31° しかなく、影は建物の高さの約 1.7 倍にもなります。"
      + "<br>北側の建物に日を当てるには、" + tex("D \\ge \\dfrac{H}{\\tan h}") + " の間隔が必要です。日照を確保するための建物の高さや配置の決まり（日影規制）も、このような計算をもとにしています。"
      + "<span class='hint'>（ここでは、南中時に影がちょうど北へのびる場合だけを考えています）</span>";
  }

  function drawDay() {
    var dec = SH.declination(S.N), hs = TU.linspace(4, 20, 641), tips = [], lens = [];
    hs.forEach(function (hr) { var tp = SH.shadowTip(S.lat, dec, hr, S.pole); tips.push(tp); lens.push(tp ? Math.hypot(tp[0], tp[1]) : null); });
    var tip = SH.shadowTip(S.lat, dec, S.hour, S.pole), alt = SH.altitude(S.lat, dec, S.hour);
    $("formula-d").innerHTML = tex("\\text{太陽の高さ}\\ " + f(alt) + "^\\circ,\\quad \\text{影の長さ}\\ L = \\frac{h}{\\tan(\\text{太陽の高さ})} " + (tip ? "\\approx " + TU.fmtNum(Math.hypot(tip[0], tip[1]), 2) + "\\ \\text{m}" : "\\ (\\text{太陽が沈んでいる})"));
    var R = 5 * S.pole, d1 = [];
    var ok = tips.map(function (t) { return t && Math.hypot(t[0], t[1]) < R * 1.6; });
    d1.push(UI.lineTrace(tips.map(function (t, i) { return ok[i] ? t[0] : null; }), tips.map(function (t, i) { return ok[i] ? t[1] : null; }), "影の先端の通り道", "#9467bd", { width: 2.5 }));
    var hours = []; for (var k = 6; k <= 18; k++) { var tp = SH.shadowTip(S.lat, dec, k, S.pole); if (tp && Math.hypot(tp[0], tp[1]) < R * 1.6) hours.push([tp, k]); }
    d1.push(UI.pointTrace(hours.map(function (q) { return q[0][0]; }), hours.map(function (q) { return q[0][1]; }), "毎正時", "#9467bd", 7,
      { text: hours.map(function (q) { return q[1] + "時"; }), mode: "markers+text", textposition: "top center", textfont: { size: 10, color: "#9467bd" } }));
    if (tip) d1.push(UI.lineTrace([0, tip[0]], [0, tip[1]], "いまの影", "#333", { width: 5 }));
    d1.push(UI.pointTrace([0], [0], "棒", "#1f77b4", 12));
    var L1 = UI.layout({ height: $("top").clientHeight || 420, showlegend: false, margin: { l: 40, r: 10, t: 24, b: 36 },
      xaxis: UI.axis({ range: [-R, R], title: { text: "西 ← → 東 [m]" } }), yaxis: UI.axis({ range: [-R * 0.4, R * 1.4], scaleanchor: "x", title: { text: "南 ← → 北 [m]" } }) });
    L1.annotations.push({ x: 0, y: R * 1.4, text: "上から見た図（北が上）", showarrow: false, yanchor: "top", font: { size: 11, color: "#666" } });
    Plotly.react("top", d1, L1, UI.CONFIG);
    var L2 = UI.layout({ height: $("len").clientHeight || 420, showlegend: false,
      xaxis: UI.axis({ range: [4, 20], dtick: 2, title: { text: "時刻" } }), yaxis: UI.axis({ range: [0, 6 * S.pole], title: { text: "影の長さ [m]" } }) });
    L2.shapes.push({ type: "line", x0: S.hour, x1: S.hour, yref: "paper", y0: 0, y1: 1, line: { color: "#333", width: 1, dash: "dot" } });
    Plotly.react("len", [UI.lineTrace(hs, lens, "影の長さ", "#1f77b4", { width: 2.5, extra: { hovertemplate: "%{x:.2f} 時：%{y:.2f} m<extra></extra>" } })], L2, UI.CONFIG);
    var noonL = SH.shadowLength(S.pole, SH.noonAltitude(S.lat, dec));
    UI.metrics("metrics-d", [["いまの太陽の高さ", f(alt) + "°"], ["南中高度", f(SH.noonAltitude(S.lat, dec)) + "°"], ["正午の影の長さ", TU.fmtNum(noonL, 2) + " m"],
      ["影の向き", tip ? (Math.abs(tip[0]) < 1e-6 ? "真北" : (tip[1] >= 0 ? "北" : "南") + (tip[0] > 0 ? "東" : "西")) : "—"]]);
    $("msg-d").innerHTML = "1 日の間に棒の影の先端がえがく線を <b>日影曲線</b> といいます。夏至と冬至では形が大きく変わり、春分・秋分ではほぼ東西にまっすぐな線になります。"
      + "<br>影の長さは太陽の高さ（角度）で決まり、" + tex("L = h / \\tan(\\text{太陽の高さ})") + "。朝夕は太陽が低いので影がとても長くなります。"
      + "<span class='hint'>（太陽の高さは球面三角法の式 " + tex("\\sin(\\text{高さ}) = \\sin\\varphi\\sin\\delta + \\cos\\varphi\\cos\\delta\\cos H") + " で計算しています。H は正午からの時間 × 15°）</span>";
  }

  function draw() { if (S.tab === "spacing") drawSpacing(); else drawDay(); S.save(); }
  var redraw = UI.throttle(draw);
  new UI.Player($("play"), function (dt) { S.hour += dt * 1.2; if (S.hour > 20) S.hour = 4; $("p-hour").value = S.hour; PD.show(); draw(); }, ["▶ 時間を進める", "⏸ 停止"]);
  UI.tabs(S, "tab", redraw);
  P.sync(); PS.sync(); PD.sync(); draw();
})();
</script>
</body>
</html>
