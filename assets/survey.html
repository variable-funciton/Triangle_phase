<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
/*__CSS__*/
.plot { height: 440px; }
.layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 12px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
td, th { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs">
    <button data-tab="height">① 高さを測る（tan）</button>
    <button data-tab="river">② 川幅を測る（正弦定理）</button>
    <button data-tab="trav">③ トラバース測量（cos・sin で座標）</button>
  </div>

  <div id="tab-height">
    <div class="params three" id="params-h"></div>
    <div class="formula"><div class="main" id="formula-h"></div></div>
    <div class="plot" id="plot-h"></div>
    <div class="info-box" id="msg-h"></div>
  </div>

  <div id="tab-river" hidden>
    <div class="params three" id="params-r"></div>
    <div class="formula"><div class="main" id="formula-r"></div><div class="sub" id="formula-r2"></div></div>
    <div class="plot" id="plot-r"></div>
    <div class="info-box" id="msg-r"></div>
  </div>

  <div id="tab-trav" hidden>
    <div class="params" id="params-t"></div>
    <div class="layout">
      <div class="plot" id="plot-t"></div>
      <div><div class="scroll-x" id="table-t"></div><div class="metrics" id="metrics-t"></div></div>
    </div>
    <div class="info-box" id="msg-t"></div>
  </div>
</div>

<script>
/*__COMMON__*/
</script>
<script>
/*__CORE__*/
</script>
<script>
(function () {
  "use strict";
  if (!UI.ready()) return;
  var $ = UI.$, tex = UI.tex;
  var S = UI.store("survey_v1", { tab: "height", d: 30, th: 35, eye: 1.5, c: 50, A: 70, B: 60, ea: 0.5, ed: 0.2 });
  function f(v, d) { return TU.fmtNum(v, d === undefined ? 2 : d); }
  var PH = UI.params("params-h", [
    { key: "d", label: "d", sub: "建物までの水平距離 [m]", min: 5, max: 100, step: 0.5, btn: 1, fmt: function (v) { return f(v, 1) + " m"; } },
    { key: "th", label: "θ", sub: "見上げる角（仰角）[°]", min: 1, max: 80, step: 0.5, btn: 1, fmt: function (v) { return f(v, 1) + "°"; } },
    { key: "eye", label: "e", sub: "目（器械）の高さ [m]", min: 0, max: 2, step: 0.05, fmt: function (v) { return f(v) + " m"; } },
  ], S, function () { redraw(); });
  var PR = UI.params("params-r", [
    { key: "c", label: "c = AB", sub: "岸に沿った基線の長さ [m]", min: 10, max: 120, step: 0.5, btn: 1, fmt: function (v) { return f(v, 1) + " m"; } },
    { key: "A", label: "α", sub: "A で測った角 ∠CAB [°]", min: 10, max: 120, step: 0.5, btn: 1, fmt: function (v) { return f(v, 1) + "°"; } },
    { key: "B", label: "β", sub: "B で測った角 ∠CBA [°]", min: 10, max: 120, step: 0.5, btn: 1, fmt: function (v) { return f(v, 1) + "°"; } },
  ], S, function () { redraw(); });
  var PT = UI.params("params-t", [
    { key: "ea", label: "角度の誤差", sub: "[°]（大きさの目安）", min: 0, max: 3, step: 0.05, fmt: function (v) { return f(v) + "°"; } },
    { key: "ed", label: "距離の誤差", sub: "[m]（大きさの目安）", min: 0, max: 2, step: 0.01, fmt: function (v) { return f(v) + " m"; } },
  ], S, function () { redraw(); });

  function drawHeight() {
    var H = SV.height(S.d, S.th, S.eye), dh = H - S.eye;
    $("formula-h").innerHTML = tex("H = d\\tan\\theta + e = " + f(S.d, 1) + "\\times\\tan " + f(S.th, 1) + "^\\circ + " + f(S.eye) + " \\approx " + f(H) + "\\ \\text{m}", true);
    var W = S.d + 10, Y = Math.max(H * 1.15, 10), data = [];
    var L = UI.layout({ height: 440, showlegend: false, margin: { l: 44, r: 10, t: 10, b: 40 },
      xaxis: UI.axis({ range: [-5, W], zeroline: false, title: { text: "[m]" } }), yaxis: UI.axis({ range: [-1, Y], scaleanchor: "x", title: { text: "[m]" } }) });
    L.shapes.push({ type: "rect", x0: S.d, x1: S.d + 6, y0: 0, y1: H, fillcolor: "rgba(31,119,180,0.3)", line: { color: "#1f77b4" } });
    L.shapes.push({ type: "line", x0: -5, x1: W, y0: 0, y1: 0, line: { color: "#555", width: 2 } });
    data.push(UI.lineTrace([0, 0], [0, S.eye], "器械", "#333", { width: 4, extra: { hoverinfo: "skip" } }));
    data.push(UI.lineTrace([0, S.d, S.d], [S.eye, S.eye, H], "", "#2ca02c", { width: 2, dash: "dash", extra: { hoverinfo: "skip" } }));
    data.push(UI.lineTrace([0, S.d], [S.eye, H], "視線", "#d62728", { width: 2.5, extra: { hoverinfo: "skip" } }));
    var arc = []; for (var i = 0; i <= 30; i++) arc.push(S.th * Math.PI / 180 * i / 30);
    var ar = Math.min(6, S.d * 0.25);
    data.push(UI.lineTrace(arc.map(function (a) { return ar * Math.cos(a); }), arc.map(function (a) { return S.eye + ar * Math.sin(a); }), "", "#d62728", { width: 1.5, extra: { hoverinfo: "skip" } }));
    L.annotations.push({ x: ar * 1.1, y: S.eye + ar * 0.25, text: "θ", showarrow: false, xanchor: "left", font: { color: "#d62728", size: 14 } });
    L.annotations.push({ x: S.d / 2, y: S.eye, text: "d = " + f(S.d, 1) + " m", showarrow: false, yanchor: "top", font: { color: "#2ca02c" } });
    L.annotations.push({ x: S.d, y: S.eye + dh / 2, text: "d tan θ ≈ " + f(dh) + " m", showarrow: false, xanchor: "right", xshift: -4, font: { color: "#2ca02c" } });
    L.annotations.push({ x: S.d + 3, y: H, text: "H ≈ " + f(H) + " m", showarrow: false, yanchor: "bottom", font: { color: "#1f77b4", size: 13 } });
    Plotly.react("plot-h", data, L, UI.CONFIG);
    $("msg-h").innerHTML = "建物のてっぺんを見上げる角（仰角）θ と、建物までの水平距離 d を測れば、" + tex("\\tan\\theta = \\dfrac{\\text{高さの差}}{d}") + " から高さがわかります。目（測量器械）の高さ e を足すのを忘れずに。"
      + "<br>θ = 45° なら高さの差は d と同じ。角度の測りまちがい 1° が、高さにどれくらい影響するか試してみよう（θ が大きいほど影響が大きい）。";
  }

  function drawRiver() {
    var T = SV.triangulate(S.c, S.A, S.B), data = [];
    if (!T) {
      $("formula-r").innerHTML = tex("\\alpha + \\beta < 180^\\circ\\ \\text{でないと三角形ができません}", true); $("formula-r2").innerHTML = "";
      Plotly.react("plot-r", [], UI.layout({ height: 440 }), UI.CONFIG); return;
    }
    $("formula-r").innerHTML = tex("AC = \\frac{c\\sin\\beta}{\\sin(\\alpha + \\beta)} = \\frac{" + f(S.c, 1) + "\\sin " + f(S.B, 1) + "^\\circ}{\\sin " + f(S.A + S.B, 1) + "^\\circ} \\approx " + f(T.AC) + "\\ \\text{m}", true);
    $("formula-r2").innerHTML = tex("\\text{川幅（C から岸 AB までの距離）} = AC\\sin\\alpha \\approx " + f(T.width) + "\\ \\text{m}");
    var C = T.C, xs = [Math.min(0, C[0]) - 10, Math.max(S.c, C[0]) + 10], Y = C[1] + 12;
    var L = UI.layout({ height: 440, showlegend: false, margin: { l: 10, r: 10, t: 10, b: 10 },
      xaxis: UI.axis({ range: xs, visible: false }), yaxis: UI.axis({ range: [-10, Y], visible: false, scaleanchor: "x" }) });
    L.shapes.push({ type: "rect", x0: xs[0] - 50, x1: xs[1] + 50, y0: 0, y1: T.width, fillcolor: "rgba(31,119,180,0.15)", line: { width: 0 }, layer: "below" });
    L.annotations.push({ x: xs[0] + 6, y: T.width / 2, text: "川", showarrow: false, font: { size: 20, color: "rgba(31,119,180,0.6)" } });
    data.push(UI.lineTrace([0, S.c, C[0], 0], [0, 0, C[1], 0], "三角形", "#333", { width: 2.5, extra: { hoverinfo: "skip" } }));
    data.push(UI.lineTrace([C[0], C[0]], [0, C[1]], "川幅", "#d62728", { width: 2, dash: "dash", extra: { hoverinfo: "skip" } }));
    data.push(UI.pointTrace([0, S.c, C[0]], [0, 0, C[1]], "", "#333", 10, { text: ["A", "B", "C（向こう岸の木）"], mode: "markers+text", textposition: ["bottom center", "bottom center", "top center"], hoverinfo: "skip" }));
    L.annotations.push({ x: S.c / 2, y: 0, text: "c = " + f(S.c, 1) + " m", showarrow: false, yanchor: "top", yshift: -14 });
    L.annotations.push({ x: 6, y: 2.5, text: "α", showarrow: false, xanchor: "left", font: { color: "#2ca02c", size: 14 } });
    L.annotations.push({ x: S.c - 6, y: 2.5, text: "β", showarrow: false, xanchor: "right", font: { color: "#2ca02c", size: 14 } });
    L.annotations.push({ x: C[0], y: C[1] / 2, text: "川幅 ≈ " + f(T.width) + " m", showarrow: false, xanchor: "left", xshift: 6, font: { color: "#d62728", size: 13 } });
    Plotly.react("plot-r", data, L, UI.CONFIG);
    $("msg-r").innerHTML = "川を渡らずに川幅を測る方法。こちらの岸に 2 点 A, B をとって距離 c を測り、向こう岸の目印 C を A と B から見た角 α, β を測ります。"
      + "<br>三角形 ABC で ∠C = 180° − α − β ≈ " + f(T.gamma, 1) + "°。正弦定理 " + tex("\\dfrac{AC}{\\sin\\beta} = \\dfrac{c}{\\sin C}") + " から AC、そして川幅 = " + tex("AC\\sin\\alpha") + "。"
      + "<br>このように三角形をつなげて遠くの位置を求めるのが <b>三角測量</b>。日本全国の地図も、三角点を結ぶ三角形の網から作られてきました。";
  }

  function drawTrav() {
    var meas = SV.measurements(S.ea, S.ed), R = SV.traverse(meas), T = SV.TRUE_PTS, data = [];
    var L = UI.layout({ height: 440, margin: { l: 44, r: 10, t: 30, b: 40 },
      xaxis: UI.axis({ range: [-15, 125], title: { text: "y（東）[m]" } }), yaxis: UI.axis({ range: [-65, 80], scaleanchor: "x", title: { text: "x（北）[m]" } }) });
    data.push(UI.lineTrace(T.concat([T[0]]).map(function (p) { return p[1]; }), T.concat([T[0]]).map(function (p) { return p[0]; }), "本当の形", "#9aa0a6", { width: 2, dash: "dot" }));
    data.push(UI.lineTrace(R.pts.map(function (p) { return p[1]; }), R.pts.map(function (p) { return p[0]; }), "測った値から計算した形", "#1f77b4", { width: 2.8 }));
    data.push(UI.pointTrace(R.pts.slice(0, -1).map(function (p) { return p[1]; }), R.pts.slice(0, -1).map(function (p) { return p[0]; }), "測点", "#1f77b4", 9,
      { text: ["1", "2", "3", "4", "5"], mode: "markers+text", textposition: "top right" }));
    var last = R.pts[R.pts.length - 1];
    if (R.closure > 1e-6) {
      UI.arrow(L, [0, 0], [last[1], last[0]], "#d62728", "", { width: 2 });
      data.push(UI.pointTrace([last[1]], [last[0]], "もどってきた点", "#d62728", 10));
    }
    Plotly.react("plot-t", data, L, UI.CONFIG);
    var rows = meas.map(function (m, i) { return "<tr><td>" + (i + 1) + "→" + ((i + 1) % 5 + 1) + "</td><td>" + f(m.L) + "</td><td>" + f(m.a) + "°</td><td>" + f(m.dx) + "</td><td>" + f(m.dy) + "</td></tr>"; }).join("");
    $("table-t").innerHTML = "<table><tr><th>辺</th><th>距離 L [m]</th><th>方位角 a</th><th>Δx = L cos a</th><th>Δy = L sin a</th></tr>" + rows
      + "<tr><td>合計</td><td>" + f(R.total) + "</td><td></td><td>" + f(R.ex) + "</td><td>" + f(R.ey) + "</td></tr></table>";
    UI.metrics("metrics-t", [["閉合誤差（ずれの長さ）", f(R.closure, 3) + " m"], ["閉合比", R.closure > 1e-6 ? "1 / " + Math.round(R.ratio) : "ぴったり"], ["一周の長さ", f(R.total, 1) + " m"]]);
    $("msg-t").innerHTML = "測量では、各辺の距離 L と <b>方位角 a（北から時計回りの角）</b> を測り、" + tex("\\Delta x = L\\cos a") + "（北向きの成分）、" + tex("\\Delta y = L\\sin a") + "（東向きの成分）を順に足して座標を求めます。"
      + "数学の座標（x が東）とは x と y が入れかわり、角度も北から時計回りに測る点に注意。"
      + "<br>一周して出発点にもどれば Δx, Δy の合計は 0 のはずですが、測定の誤差でずれます（赤い矢印）。このずれを <b>閉合誤差</b>、一周の長さとの比を <b>閉合比</b> といい、測量の精度の目安にします（誤差のスライダーを動かしてみよう）。";
  }

  function draw() { if (S.tab === "height") drawHeight(); else if (S.tab === "river") drawRiver(); else drawTrav(); S.save(); }
  var redraw = UI.throttle(draw);
  UI.tabs(S, "tab", redraw);
  PH.sync(); PR.sync(); PT.sync(); draw();
})();
</script>
</body>
</html>
